# Non-secret config for the DEV environment.
# Secrets (API keys) come from a local .env file, never from this file.
app_env: dev
log_level: DEBUG

model:
  provider: mock          # use mock/small model for fast, cheap iteration
  name: gpt-4o-mini
  max_tokens: 512

scaling:
  min_instances: 0
  max_instances: 1
  concurrency: 20

observability:
  trace_sample_rate: 1.0  # trace everything while developing

network:
  public_access: false    # local only
