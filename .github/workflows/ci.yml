name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest 03-agent-safety-guardrails/ 01-fastapi-deployment/ -q

      - name: Eval gate
        run: python 02-evaluation-evals/evals/run_eval.py

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agentic-ai:${{ github.sha }} -f 06-docker-cicd/Dockerfile .

      # - name: Deploy (add your cloud step here — see 05-cloud-aws-gcp-azure)
      #   run: echo "deploy step goes here"
