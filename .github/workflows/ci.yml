name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest 03-agent-safety-guardrails/ 01-fastapi-deployment/ -q

      - name: Eval gate
        run: python 02-evaluation-evals/evals/run_eval.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (validation)
        run: docker build -t agentic-ai:${{ github.sha }} -f 06-docker-cicd/Dockerfile .

  # Build the image ONCE, push to Artifact Registry, then promote the same
  # image tag through dev -> stage -> prod (GitHub Environments gate each step).
  push-image:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # keyless GCP auth (Workload Identity Federation)
    outputs:
      image: ${{ steps.build-push.outputs.image }}
    env:
      AR_PROJECT: ${{ vars.AR_PROJECT_ID }}
      AR_REGION: ${{ vars.AR_REGION }}
      AR_REPO: ${{ vars.AR_REPO }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${AR_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        id: build-push
        run: |
          IMAGE="${AR_REGION}-docker.pkg.dev/${AR_PROJECT}/${AR_REPO}/${IMAGE_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE" -f 06-docker-cicd/Dockerfile .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: push-image
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      environment: dev
      image: ${{ needs.push-image.outputs.image }}
      app_env: dev
      min_instances: "0"
      max_instances: "1"
    secrets: inherit

  deploy-stage:
    needs: [push-image, deploy-dev]
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      environment: stage
      image: ${{ needs.push-image.outputs.image }}
      app_env: stage
      min_instances: "1"
      max_instances: "3"
    secrets: inherit

  deploy-prod:
    needs: [push-image, deploy-stage]
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      environment: prod
      image: ${{ needs.push-image.outputs.image }}
      app_env: prod
      min_instances: "2"
      max_instances: "20"
    secrets: inherit
