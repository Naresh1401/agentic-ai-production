name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint, tests and the image build use the shared checks from
# https://github.com/Naresh1401/github-cicd-workflows
jobs:
  test:
    name: Lint, test and eval gate
    uses: Naresh1401/github-cicd-workflows/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.12"
      install-command: python -m pip install -r requirements.txt
      lint: check
      test-command: >-
        python -m pytest 01-fastapi-deployment/ 02-evaluation-evals/ 03-agent-safety-guardrails/
        07-cost-latency-optimization/ 08-agent-architecture/ projects/support-agent/ -q
        && python 02-evaluation-evals/evals/run_eval.py
        && python projects/support-agent/evals/run_eval.py

  repo-lint:
    name: Repository lint
    uses: Naresh1401/github-cicd-workflows/.github/workflows/repo-lint.yml@v1

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Terraform format + validate
        working-directory: 09-infrastructure-governance/iac/terraform
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Policy check + tests
        run: |
          opa check 09-infrastructure-governance/policy
          opa test 09-infrastructure-governance/policy -v

  build:
    name: Docker image
    needs: test
    uses: Naresh1401/github-cicd-workflows/.github/workflows/container.yml@v1
    with:
      dockerfile: 06-docker-cicd/Dockerfile
      context: .

  # Build the image ONCE, push to Artifact Registry, then promote the same
  # image tag through dev -> stage -> prod (GitHub Environments gate each step).
  push-image:
    needs: [build, governance]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # keyless GCP auth (Workload Identity Federation)
    outputs:
      image: ${{ steps.build-push.outputs.image }}
    env:
      AR_PROJECT: ${{ vars.AR_PROJECT_ID }}
      AR_REGION: ${{ vars.AR_REGION }}
      AR_REPO: ${{ vars.AR_REPO }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${AR_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        id: build-push
        run: |
          IMAGE="${AR_REGION}-docker.pkg.dev/${AR_PROJECT}/${AR_REPO}/${IMAGE_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE" -f 06-docker-cicd/Dockerfile .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: push-image
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      environment: dev
      image: ${{ needs.push-image.outputs.image }}
      app_env: dev
      min_instances: "0"
      max_instances: "1"
    secrets: inherit

  deploy-stage:
    needs: [push-image, deploy-dev]
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      environment: stage
      image: ${{ needs.push-image.outputs.image }}
      app_env: stage
      min_instances: "1"
      max_instances: "3"
    secrets: inherit

  deploy-prod:
    needs: [push-image, deploy-stage]
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      environment: prod
      image: ${{ needs.push-image.outputs.image }}
      app_env: prod
      min_instances: "2"
      max_instances: "20"
    secrets: inherit
